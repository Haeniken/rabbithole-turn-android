# Sanitized template. Replace every value in angle brackets before importing.
[Interface]
Address = <client-address-with-prefix>
PrivateKey = <wireguard-private-key>
DNS = <dns-server>
MTU = <mtu>

[Peer]
Endpoint = tunnel.example.com:<wireguard-port>
PublicKey = <wireguard-public-key>
AllowedIPs = <routes>
PersistentKeepalive = <keepalive-seconds>

# TURN transport metadata
#@wgt:EnableTURN = true
#@wgt:UseUDP = false
#@wgt:IPPort = proxy.example.com:<proxy-port>
#@wgt:VKLink = https://vk.com/call/join/<call-token>
#@wgt:Mode = vk_link
#@wgt:PeerType = proxy_v2
#@wgt:StreamNum = <stream-count>
#@wgt:LocalPort = <local-port>
#@wgt:StreamsPerCred = <streams-per-credential>
#@wgt:WatchdogTimeout = <timeout-seconds>

# Optional explicit TURN endpoint override
#@wgt:TurnIP = turn.example.com
#@wgt:TurnPort = <turn-port>

# Optional WRAP protection for proxy_v1 or proxy_v2 over TCP/DTLS
#@wgt:UseWrap = false
#@wgt:WrapKeyHex = <shared-wrap-key>
